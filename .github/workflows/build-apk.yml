name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RAZ-Smoke-Tracker.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: RAZ-Smoke-Tracker-apk
          path: RAZ-Smoke-Tracker.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "RAZ'S Smoke Tracker, build ${{ github.run_number }}"
          body: "Download RAZ-Smoke-Tracker.apk below, open it on your Android phone and tap Install."
          make_latest: true
          files: RAZ-Smoke-Tracker.apk
